<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning Vue</title>
    <script src="app.js" defer></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="index.css">
</head>

<body>
    <div id="app">
        <!-- attribut binding -->
        <a v-bind:href="url">click this for a surprise</a><br>
        <!-- same as v-bind (shortcut) -->
        <a :href="url">click this for a surprise</a><br><br>

        <!-- <p>{{title}} - {{author}} - {{age}}</p>

        <button v-on:click="age++">Increase age</button>
        <button v-on:click="age--">Decrease age</button>
        <div @click="changeTitle('Knight of the seven kingdom')">Change the title</div> -->

        <div v-if="showBooks">
            <!-- <p>{{title}} - {{author}} - {{age}}</p> -->
            <ul>
                <!-- for loop -->
                <!-- dynamic class -->
                <!-- alternative way of changing the fav class when clicked -> 
                 <li v-for="book in books" :class="{fav: book.isFav}" @click="toggleIsFav($event, book)"></li> -->
                <li v-for="book in books" :class="{fav: book.isFav}" @click="book.isFav = !book.isFav">
                    <img :src="book.img" :alt="book.title">
                    <h3>{{book.title}}</h3>
                    <p>{{book.author}}</p>
                </li>
            </ul>
        </div>

        <button @click="toggleShowBooks">
            <!-- this completely removes the element from html -->
            <span v-if="showBooks">Hide Book</span>
            <!-- <span v-if="!showBooks">Show Book</span> -->
            <!-- same as the above -->
            <span v-else>Show Books</span>
        </button>

        <!-- this just changes the display to hide/show the element -->
        <div v-show="showBooks">currently showing book</div>

        <!-- computed properties -->
        <p>{{filteredBooks}}</p>
        <h2>Filtered books</h2>
        <ul>
            <li v-for="book in filteredBooks" :class="{fav: book.isFav}" @click="book.isFav = !book.isFav">
                <img :src="book.img" :alt="book.title">
                <h3>{{book.title}}</h3>
                <p>{{book.author}}</p>
            </li>
        </ul>

        <br><br>
        <!-- mouse events -->
        <div class="box" @mouseover="handleEvent($event, 5)">mouseover (enter)</div>
        <div class="box" @mouseleave="handleEvent">mouseleave</div>
        <div class="box" @dblclick="handleEvent">double click</div>
        <div class="box" @mousemove="handleMouseMove">position: {{xPos}}, {{yPos}}</div>
    </div>
</body>

</html>
