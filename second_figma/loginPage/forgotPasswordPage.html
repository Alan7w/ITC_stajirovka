<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="forgotPasswordPage.css">
        <title>Reset Password</title>
    </head>
    <body>
        <a class="back-btn" href="loginPage.html"><img src="../icons/back-btn.svg" alt="back-button"> Ortga</a>
        <section class="forgot-password">
            <div class="form-div">
                <h1>Parolni tiklash</h1><br><br>
                <p class="forgot-password-instructions">Sizga kod yuborishimiz uchun emailingizni kiriting</p>
                <form action="#show-confirmation-popup" class="forgot-password-form">                    
                    <label for="forgot-password-email">Email</label>
                    <input type="email" id="forgot-password-email" placeholder="emailingizni kiriting..." required><br><br>

                    <button type="submit">Kod yuborish</button>
                </form>
            </div>
        </section>

        
        <section id="show-confirmation-popup" class="popup-overlay">
            <div class="popup-backdrop">
                <div class="popup-content">
                    <img src="../icons/confirmation-popup-logo.svg" class="popup-logo" alt="confirmation-popup-logo">
                    <h1>Kod emailga yuborildi</h1>
                    <button onclick="window.location.href='loginPage.html'">Davom etish</button>
                </div>
            </div>
        </section>
    </body>
</html>
