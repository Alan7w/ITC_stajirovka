<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="specificity.css">
        <title>Specificity practice</title>
    </head>

        <div class="card" id="card">
            <h2 class="title">The Card Title</h2>
        </div>

        <ul class="menu">
            <li class="item"><a href="#" class="link">Home Page</a></li>
        </ul>

        <p class="note" id="note">A single line paragraph</p>

        <div class="box">
            <span class="label">Label A</span>
        </div>

        <div class="wrap">
            <p class="msg">This is my message to the World!</p>
        </div>

        <button class="btn primary" disabled>Click me</button> <br><br>

        <a href="#" class="nav-link">Small Link</a>

        <input type="text" class="field" name="inputField">

        <div class="panel active">
            <p class="text">Panel (active) text</p>
        </div>

        <div class="row">
            <span class="cell" data-x="1">Cell</span>
        </div>

        <div class="another_card">
            <h3 class="title">This is another card</h3>
        </div>

        <div class="yet_another_card">
            <h3 class="title">Yet Another Card</h3>
        </div>

        <p class="t" id="t" style="color: orange;">Inline style wins here</p>

        <p class="a" id="a">Let's test !important rule</p>

        <div class="another_box" id="another_box">
            <span class="x">Importan message here</span>
        </div>
        <br>

        <form action="#">
            <input type="file">
        </form>
    </body>
